<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>作者ページ — frank html</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%230071e3%27/%3E%3Ctext x=%2750%27 y=%2568%27 font-size=%2755%27 font-family=%27-apple-system,sans-serif%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3Ef%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">frank html</a>
    <div class="header-actions">
      <a class="btn" href="index.html">一覧に戻る</a>
    </div>
  </header>

  <main class="form-page" id="author-root">
    <p>読み込み中…</p>
  </main>

  <!-- 作品プレイヤー（一覧ページと共通の構造） -->
  <div class="player-overlay" id="player-overlay" hidden>
    <div class="player-topbar">
      <div class="player-title-block">
        <span class="player-title" id="player-title"></span>
        <a class="player-author-link" id="player-author-link" href="#" target="_blank" rel="noopener" hidden></a>
      </div>
      <div class="player-actions">
        <button id="player-rotate-btn" class="btn player-action-btn player-rotate-btn" type="button" title="PCでスマホ用ゲームを縦画面で表示">縦画面</button>
        <button id="player-landscape-btn" class="btn player-action-btn player-landscape-btn" type="button" title="PC画面サイズの枠に収めて表示">PC画面</button>
        <button id="player-fullscreen-btn" class="btn player-action-btn" type="button" title="上部バーを消して全画面表示">全画面</button>
        <button id="player-review-btn" class="btn player-action-btn" type="button">レビュー</button>
        <button id="player-close" class="btn btn-icon" aria-label="閉じる">✕</button>
      </div>
    </div>
    <details class="player-desc" id="player-desc" hidden>
      <summary>作品の説明を読む</summary>
      <p id="player-desc-text"></p>
    </details>
    <div class="player-body" id="player-body">
      <aside class="player-side player-side-left" id="player-side-left" hidden></aside>
      <div class="player-frame-wrap" id="player-frame-wrap"></div>
      <aside class="player-side player-side-right" id="player-side-right" hidden></aside>
    </div>
  </div>

  <!-- 評価・コメントモーダル（一覧ページと共通の構造） -->
  <div class="rate-modal-overlay" id="rate-modal-overlay" hidden>
    <div class="rate-modal">
      <div class="rate-modal-header">
        <span class="rate-modal-title" id="rate-modal-title"></span>
        <div class="rate-modal-header-actions">
          <button id="rate-modal-close" class="btn btn-icon" aria-label="閉じる">✕</button>
        </div>
      </div>
      <div class="rate-modal-body">
        <div id="rate-modal-rating"></div>
        <div id="rate-modal-comments"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initAuthorPage } from "./js/author.js";
    import { initPlayer } from "./js/player.js";
    import { initRateModal } from "./js/rate-modal.js";
    import { initThemeToggle } from "./js/theme.js";
    initThemeToggle();
    initAuthorPage();
    initPlayer();
    initRateModal();
  </script>
</body>
</html>
