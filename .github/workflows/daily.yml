name: daily-batch

# frank pro — 1日1回まとめて実行する処理
# サムネ生成 / ベイズ平均の再計算 / 古いコメントログの削除
# publicリポジトリなのでActionsの実行時間は無料（docs/frank-pro-handoff.md 6章）
#
# 事前に Settings > Secrets and variables > Actions で以下を登録すること:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, WORKS_BASE_URL

on:
  schedule:
    - cron: "0 18 * * *" # 毎日 03:00 JST
  workflow_dispatch: # 手動実行、および投稿直後のsign-upload Edge Functionからの即時起動用
    inputs:
      thumbnails_only:
        description: "true にするとサムネ生成だけ実行し、ベイズ再計算・ログ削除はスキップする（投稿直後の即時実行用）"
        required: false
        default: "false"
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/daily
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate thumbnails
        run: npm run thumbnails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORKS_BASE_URL: ${{ secrets.WORKS_BASE_URL }}

      - name: Recompute bayesian ranking
        if: github.event.inputs.thumbnails_only != 'true'
        run: npm run recompute
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Purge old comment sender logs
        if: github.event.inputs.thumbnails_only != 'true'
        run: npm run purge
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
